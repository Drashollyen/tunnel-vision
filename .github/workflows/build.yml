# Builds the game for Windows (our only target platform) after every merge to main, or on
# demand from the Actions tab (Build > Run workflow). Download it from the run's "Artifacts" section.
# Merges that only touch docs or GitHub config don't trigger a build.
name: Build

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.gitattributes'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_PLATFORM: StandaloneWindows64
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      - name: Restore Unity Library cache
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ env.TARGET_PLATFORM }}-

      - name: Build
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          buildName: TunnelVision

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: TunnelVision-${{ env.TARGET_PLATFORM }}-${{ github.sha }}
          path: build/${{ env.TARGET_PLATFORM }}
          retention-days: 14
