# Builds the game for Windows (our only target platform).
#
# - After a merge to main that changes the game (Assets, Packages, ProjectSettings).
# - On a pull request that changes this file (e.g. a Dependabot unity-builder update), so a new
#   builder is proven before it lands. "Build Windows" is a required check: on every other PR
#   it is skipped, which GitHub counts as passed.
# - On demand from the Actions tab (Build > Run workflow).
#
# Each change is built at most once: a build.yml-only change is tested on its PR and is not
# rebuilt after merging. Download builds from the run's "Artifacts" section.
#
# Releases: run it from the Actions tab on main with a version, like v1.0. The game is built with
# that version, zipped as "Tunnel Vision v1.0.zip" and published as a GitHub Release tagged v1.0.
# Leave the version empty for a plain build. A version that's already been released is refused
# before anything is built.
name: Build

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.gitattributes'
  pull_request:
    branches: [main, revamp]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, like v1.0. Leave empty to only build.'
        required: false
        default: ''
        type: string

# A release gets a group of its own, so a later push to main can't cancel it halfway.
concurrency:
  group: build-${{ github.ref }}${{ inputs.version && format('-release-{0}', inputs.version) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect build changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            build:
              - '.github/workflows/build.yml'

  build:
    name: Build Windows
    needs: changes
    # On PRs, only build when this workflow changed (or when detection itself failed, to be safe).
    # Pushes to main and manual runs always build ("changes" is skipped for them, hence always()).
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.result == 'failure' ||
        needs.changes.outputs.build == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_PLATFORM: StandaloneWindows64
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact: ${{ steps.release.outputs.artifact }}
    steps:
      # Checked before the long build, so a mistyped or repeated version fails in seconds.
      - name: Check the release version
        id: release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          artifact="TunnelVision-$TARGET_PLATFORM-$GITHUB_SHA"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ]; then
            echo "No version given: building without a release."
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main. Run this on main, not ${GITHUB_REF#refs/heads/}."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::'$VERSION' isn't a version like v1.0 or v1.0.1."
            exit 1
          fi
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "::error::$VERSION has already been released. Pick the next version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION."

      # The Unity Docker image is large and some runners don't have room for it, which fails the
      # build with "no space left on device". This job doesn't use any of these tools.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      # Unity gets killed on startup (exit code 137) when it restores a Library saved from these
      # exact files. Pushes only build when game files changed, so they get an older Library.
      # PR and manual builds can match, so they build from scratch.
      - name: Restore Unity Library cache
        if: github.event_name == 'push'
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ env.TARGET_PLATFORM }}-

      - name: Build
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # GameCI looks up its CLI release via the GitHub API. Without a token that call shares a
          # 60 requests/hour limit with every job on the runner's IP and fails with 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          buildName: TunnelVision
          # A release stamps its version into the game (Application.version); plain builds keep
          # the usual version worked out from git.
          versioning: ${{ steps.release.outputs.number && 'Custom' || 'Semantic' }}
          version: ${{ steps.release.outputs.number }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: build/${{ env.TARGET_PLATFORM }}
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: build

      # The zip holds a "Tunnel Vision" folder, so unzipping doesn't spill files everywhere.
      # Unity's debug and backup folders are left out: they aren't meant to ship.
      - name: Zip the game
        run: |
          staging="$RUNNER_TEMP/release"
          mkdir -p "$staging/Tunnel Vision"
          cp -r build/. "$staging/Tunnel Vision/"
          find "$staging/Tunnel Vision" -maxdepth 1 -type d \
            \( -name '*_BurstDebugInformation_DoNotShip' -o -name '*_BackUpThisFolder_ButDontShipItWithYourGame' \) \
            -exec rm -rf {} +
          cd "$staging"
          zip -qr "Tunnel Vision $VERSION.zip" "Tunnel Vision"
          ls -lh "Tunnel Vision $VERSION.zip"

      # Also kept on the run as "Tunnel Vision v1.0", which downloads as exactly
      # "Tunnel Vision v1.0.zip" (with the same "Tunnel Vision" folder inside).
      - name: Keep the zip on the run
        uses: actions/upload-artifact@v7
        with:
          name: Tunnel Vision ${{ env.VERSION }}
          path: |
            ${{ runner.temp }}/release/
            !${{ runner.temp }}/release/*.zip
          retention-days: 90

      # GitHub swaps spaces in release file names for dots, so the download is
      # "Tunnel.Vision.v1.0.zip"; the release page labels it "Tunnel Vision v1.0.zip".
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" \
            "$RUNNER_TEMP/release/Tunnel Vision $VERSION.zip#Tunnel Vision $VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Tunnel Vision $VERSION" \
            --generate-notes
