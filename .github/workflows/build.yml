# Builds the game for Windows (our only target platform).
#
# - After a merge to main that changes the game (Assets, Packages, ProjectSettings).
# - On a pull request that changes this file (e.g. a Dependabot unity-builder update), so a new
#   builder is proven before it lands. "Build Windows" is a required check: on every other PR
#   it is skipped, which GitHub counts as passed.
# - On demand from the Actions tab (Build > Run workflow).
#
# Each change is built at most once: a build.yml-only change is tested on its PR and is not
# rebuilt after merging. Download builds from the run's "Artifacts" section.
name: Build

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.gitattributes'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect build changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            build:
              - '.github/workflows/build.yml'

  build:
    name: Build Windows
    needs: changes
    # On PRs, only build when this workflow changed (or when detection itself failed, to be safe).
    # Pushes to main and manual runs always build ("changes" is skipped for them, hence always()).
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.result == 'failure' ||
        needs.changes.outputs.build == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_PLATFORM: StandaloneWindows64
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Create LFS file list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Git LFS pull
        run: |
          git lfs pull
          git add .
          git reset --hard

      - name: Restore Unity Library cache
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ env.TARGET_PLATFORM }}-

      - name: Build
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # GameCI looks up its CLI release via the GitHub API. Without a token that call shares a
          # 60 requests/hour limit with every job on the runner's IP and fails with 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          buildName: TunnelVision

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: TunnelVision-${{ env.TARGET_PLATFORM }}-${{ github.sha }}
          path: build/${{ env.TARGET_PLATFORM }}
          retention-days: 14
